# Track upstream without merging over divergent local work.
# Publish only the upstream's source tree; never build or redistribute game binaries.
name: Sync ACNHRecomp upstream and release source snapshots

on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/upstream-sync-source-release.yml']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: acnhrecomp-upstream-source-release
  cancel-in-progress: false

jobs:
  sync-and-release:
    if: github.repository == '969981/ACNHRecomp'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fast-forward dedicated upstream-main branch only
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Nycolazs/ACNHRecomp.git
          git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/main
          upstream_sha="$(git rev-parse refs/remotes/upstream/main)"
          # Keep a dedicated tracking branch with upstream history, but do not
          # import workflow changes: the Actions token has no workflows scope.
          # Do not touch downstream main or force-update the tracking branch.
          if git ls-remote --exit-code --heads origin upstream-main >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/upstream-main:refs/remotes/origin/upstream-main
            git switch -C upstream-main refs/remotes/origin/upstream-main
          else
            git switch -C upstream-main refs/remotes/origin/main
          fi
          before="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$upstream_sha" HEAD; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            # A failed merge may be recoverable if ONLY workflows conflict.
            git merge --no-ff --no-commit "$upstream_sha" || true
            git restore --source="$before" --staged --worktree -- .github/workflows
            if [[ -n "$(git ls-files -u)" ]]; then
              echo "::error::Upstream source conflicts remain; review manually."
              git ls-files -u
              exit 1
            fi
            if ! git diff --cached --quiet "$before" -- .github/workflows; then
              echo "::error::Workflow tree was changed; refusing to push."
              exit 1
            fi
            git commit -m "chore(sync): import upstream $upstream_sha without workflow changes"
            git push origin HEAD:refs/heads/upstream-main
          else
            echo "Already contains upstream $upstream_sha."
          fi
          tag="upstream-${upstream_sha:0:12}"
          # Use our workflow-preserving merge commit as the release tag target.
          # Tagging the raw upstream commit would import workflow files again.
          tracked_head="$(git rev-parse HEAD)"
          {
            echo "upstream=$upstream_sha"
            echo "tag=$tag"
            echo "tracked_head=$tracked_head"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
          echo "Tracked upstream commit $upstream_sha without modifying main." >> "$GITHUB_STEP_SUMMARY"

      - name: Offer a review PR when histories differ
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(gh pr list --head upstream-main --base main --state open --json number --jq 'length')" == '0' ]]; then
            gh pr create --head upstream-main --base main \
              --title 'chore: review upstream ACNHRecomp updates' \
              --body 'Automated upstream tracking. Histories may conflict: review and resolve manually. The sync workflow never force-pushes or auto-merges into main.' || echo 'PR could not be created; tracking branch remains available.'
          fi

      - name: Archive upstream sources and checksums
        if: steps.sync.outputs.publish == 'true'
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar --prefix=ACNHRecomp/ "$UPSTREAM_SHA" | gzip -n > "dist/ACNHRecomp-upstream-source-${UPSTREAM_SHA:0:12}.tar.gz"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Publish ROM-free source snapshot
        if: steps.sync.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.sync.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream }}
          TRACKED_HEAD: ${{ steps.sync.outputs.tracked_head }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          printf 'Unofficial source-only upstream snapshot from Nycolazs/ACNHRecomp.\nUpstream commit: %s\nDownstream main is not changed by this workflow.\nNo Nintendo game ROM or game-derived binary is distributed.\n' "$UPSTREAM_SHA" > release-notes.md
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TRACKED_HEAD" \
            --title "ACNHRecomp upstream source ${UPSTREAM_SHA:0:12}" \
            --notes-file release-notes.md \
            --prerelease
