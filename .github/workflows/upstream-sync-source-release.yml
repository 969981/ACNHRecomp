# Track upstream without merging over divergent local work.
# Publish only the upstream's source tree; never build or redistribute game binaries.
name: Sync ACNHRecomp upstream and release source snapshots

on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/upstream-sync-source-release.yml']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: acnhrecomp-upstream-source-release
  cancel-in-progress: false

jobs:
  sync-and-release:
    if: github.repository == '969981/ACNHRecomp'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fast-forward dedicated upstream-main branch only
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Nycolazs/ACNHRecomp.git
          git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/main
          upstream_sha="$(git rev-parse refs/remotes/upstream/main)"
          # Only create/fast-forward the tracking ref. A rewritten upstream will
          # fail safely instead of overwriting downstream history.
          git push origin refs/remotes/upstream/main:refs/heads/upstream-main
          tag="upstream-${upstream_sha:0:12}"
          {
            echo "upstream=$upstream_sha"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
          echo "Tracked upstream commit $upstream_sha without modifying main." >> "$GITHUB_STEP_SUMMARY"

      - name: Offer a review PR when histories differ
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(gh pr list --head upstream-main --base main --state open --json number --jq 'length')" == '0' ]]; then
            gh pr create --head upstream-main --base main \
              --title 'chore: review upstream ACNHRecomp updates' \
              --body 'Automated upstream tracking. Histories may conflict: review and resolve manually. The sync workflow never force-pushes or auto-merges into main.' || echo 'PR could not be created; tracking branch remains available.'
          fi

      - name: Archive upstream sources and checksums
        if: steps.sync.outputs.publish == 'true'
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar --prefix=ACNHRecomp/ "$UPSTREAM_SHA" | gzip -n > "dist/ACNHRecomp-upstream-source-${UPSTREAM_SHA:0:12}.tar.gz"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Publish ROM-free source snapshot
        if: steps.sync.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.sync.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          printf 'Unofficial source-only upstream snapshot from Nycolazs/ACNHRecomp.\nUpstream commit: %s\nDownstream main is not changed by this workflow.\nNo Nintendo game ROM or game-derived binary is distributed.\n' "$UPSTREAM_SHA" > release-notes.md
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$UPSTREAM_SHA" \
            --title "ACNHRecomp upstream source ${UPSTREAM_SHA:0:12}" \
            --notes-file release-notes.md \
            --prerelease
